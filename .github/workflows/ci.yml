name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit, integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Prepare test environment files
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=4100
          WEB_ORIGIN=http://localhost:5174
          DATABASE_URL=postgresql://whoosh:whoosh_dev_password@localhost:5433/whoosh_stay_test?schema=public
          SESSION_SECRET=test-only-session-secret-0123456789-abcdefghijklmnop
          SESSION_TTL_HOURS=2
          AUTH_MODE=mock
          EMPLOYEE_SYNC_ENABLED=false
          ROSTER_SYNC_ENABLED=false
          SEED_DEMO=true
          RATE_LIMIT_MAX=100000
          API_RATE_LIMIT_MAX=100000
          LOG_LEVEL=silent
          MINIO_PORT=9110
          EOF
          cat > .env.e2e <<'EOF'
          NODE_ENV=test
          PORT=4001
          WEB_ORIGIN=http://localhost:5175
          WEB_PORT=5175
          API_PROXY_TARGET=http://localhost:4001
          DATABASE_URL=postgresql://whoosh:whoosh_dev_password@localhost:5433/whoosh_stay_e2e?schema=public
          SESSION_SECRET=e2e-only-session-secret-0123456789-abcdefghijklmnop
          SESSION_TTL_HOURS=2
          AUTH_MODE=mock
          EMPLOYEE_SYNC_ENABLED=false
          ROSTER_SYNC_ENABLED=false
          SEED_DEMO=true
          RATE_LIMIT_MAX=100000
          API_RATE_LIMIT_MAX=100000
          LOG_LEVEL=warn
          MINIO_PORT=9110
          EOF

      - name: Build shared package
        run: npm run build -w @whoosh/shared

      - name: Generate Prisma client
        run: npm run db:generate -w @whoosh/api

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Start Postgres and MinIO
        run: |
          docker compose up -d postgres minio
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U whoosh -d whoosh_stay >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres pg_isready -U whoosh -d whoosh_stay
          docker compose up --exit-code-from minio-init minio-init

      - name: Ensure test databases exist
        run: |
          for db in whoosh_stay_test whoosh_stay_e2e; do
            if ! docker compose exec -T postgres psql -U whoosh -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1; then
              docker compose exec -T postgres createdb -U whoosh "$db"
            fi
          done

      - name: Integration tests (whoosh_stay_test)
        run: npm run test:integration

      - name: Migrate and seed demo database
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 7

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop services
        if: always()
        run: docker compose down -v
